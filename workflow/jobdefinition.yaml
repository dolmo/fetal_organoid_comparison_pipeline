apiVersion: batch/v1
kind: Job
metadata:
  name: ${JOB_PREFIX}-${NAME}-${CONTAINER_NAME}
spec:
  backoffLimit: 0
  completions: 1
  template:
    metadata:
      labels:
        k8s-app: ${JOB_PREFIX}-${NAME}-${CONTAINER_NAME}
    spec:
      restartPolicy: Never
      containers:
      - name: ${CONTAINER_NAME}
        image: ${DOCKER_IMAGE}
        command: ["stdbuf", "-i0", "-o0", "-e0", "bash", "-c"]
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: AWS_ACCESS_KEY_ID
          value: "${AWS_ACCESS_KEY_ID}"
        - name: AWS_SECRET_ACCESS_KEY
          value: "${AWS_SECRET_ACCESS_KEY}"
        - name: ENDPOINT
          value: "${S3_ENDPOINT}"
        - name: PROJECT_ROOT
          value: "${PROJECT_ROOT}"
        - name: OUTPUT_DIR
          value: "${OUTPUT_DIR}"
        - name: INPUT_S3_PATH
          value: "${INPUT_S3_PATH}"
        - name: S3_ENDPOINT_URL_RESULTS
          value: "${S3_ENDPOINT_URL_RESULTS}"
        args:
          - "${RUN_COMMAND}"
        resources:
          limits:
            memory: ${MEMORY_LIMIT}
            cpu: "${CPU_LIMIT}"
            ephemeral-storage: ${STORAGE_LIMIT}
          requests:
            memory: ${MEMORY_REQUEST}
            cpu: "${CPU_REQUEST}"
            ephemeral-storage: ${STORAGE_REQUEST}
        volumeMounts:
        - name: ephemeral
          mountPath: "/data"
        - name: script-vol
          mountPath: /opt/scripts
        # SystemV shared memory
        - name: "dshm"
          mountPath: "/dev/shm"
      volumes:
      # Ephemeral storage
      - name: ephemeral
        emptyDir: {}
      - name: dshm
        emptyDir:
          medium: Memory
      - name: script-vol
        configMap:
          name: rima-scripts-all
          defaultMode: 0755
      tolerations:
        - key: "nautilus.io/chase-ci"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                # Host blacklist
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - k8s-chase-ci-04.calit2.optiputer.net
                    - k8s-chase-ci-01.noc.ucsb.edu
                    - k8s-chase-ci-02.calit2.optiputer.net
                    - fiona8-1.calit2.uci.edu
                    - k8s-chase-ci-06.calit2.optiputer.net